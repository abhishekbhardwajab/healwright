<!doctype html><html><head><meta charset="utf-8"><title>Settings</title><link rel="stylesheet" href="style.css"></head>
<body><h1>Settings</h1>
<button id="open">Open settings</button>
<button id="del">Delete account</button>
<p id="status" role="status"></p>
<dialog id="dlg" aria-labelledby="dlgTitle">
  <h2 id="dlgTitle">Preferences</h2>
  <label for="nick">Nickname</label><input id="nick">
  <button id="save">Save</button><button id="cancel">Cancel</button>
</dialog>
<script>
const dlg = document.getElementById('dlg');
document.getElementById('open').onclick = () => dlg.showModal();
document.getElementById('cancel').onclick = () => dlg.close();
document.getElementById('save').onclick = () => { document.getElementById('status').textContent = 'Saved ' + document.getElementById('nick').value; dlg.close(); };
document.getElementById('del').onclick = () => { if (confirm('Really delete?')) document.getElementById('status').textContent = 'Deleted'; };
</script></body></html>
